<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10224a" />
  <meta name="description" content="HRMS — people, processes, and payroll in one workspace." />
  <title>HRMS — Human Resource Management System</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand-row">
        <a class="brand" href="#dashboard" data-page-link="overview" aria-label="HRMS dashboard">
          <span class="brand-mark" aria-hidden="true"><span>H</span></span><strong>HRMS</strong>
        </a>
        <button class="sidebar-close icon-button" type="button" data-action="close-sidebar" aria-label="Close menu">×</button>
      </div>
      <nav class="primary-nav" aria-label="HRMS modules">
        <button class="nav-item is-active" type="button" data-page="overview"><span class="nav-icon" data-icon="overview"></span><span>Dashboard</span></button>
        <button class="nav-item" type="button" data-page="people"><span class="nav-icon" data-icon="people"></span><span>Employees</span><span class="nav-count" id="people-nav-count">1,248</span></button>
        <button class="nav-item" type="button" data-page="organization"><span class="nav-icon" data-icon="organization"></span><span>Organization</span></button>
        <button class="nav-item" type="button" data-page="attendance"><span class="nav-icon" data-icon="clock"></span><span>Attendance</span></button>
        <button class="nav-item" type="button" data-page="timeoff"><span class="nav-icon" data-icon="calendar"></span><span>Leave</span><span class="nav-pill" id="leave-nav-count">12</span></button>
        <button class="nav-item" type="button" data-page="payroll"><span class="nav-icon" data-icon="wallet"></span><span>Payroll</span><span class="nav-arrow">›</span></button>
        <button class="nav-item" type="button" data-page="hiring"><span class="nav-icon" data-icon="briefcase"></span><span>Recruitment</span></button>
        <button class="nav-item" type="button" data-page="performance"><span class="nav-icon" data-icon="target"></span><span>Performance</span></button>
        <button class="nav-item" type="button" data-page="documents"><span class="nav-icon" data-icon="file"></span><span>Documents</span></button>
        <button class="nav-item" type="button" data-page="reports"><span class="nav-icon" data-icon="chart"></span><span>Reports</span></button>
        <button class="nav-item" type="button" data-page="audit"><span class="nav-icon" data-icon="audit"></span><span>Audit Logs</span></button>
        <button class="nav-item" type="button" data-page="settings"><span class="nav-icon" data-icon="settings"></span><span>Settings</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-footnote"><span class="footnote-dot"></span><span>All systems operational</span></div>
        <div class="sidebar-version">HRMS Workspace <span>v2.4.0</span></div>
      </div>
    </aside>
    <div class="mobile-scrim" data-action="close-sidebar"></div>
    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle icon-button" type="button" data-action="open-sidebar" aria-label="Open navigation"><span></span><span></span><span></span></button>
          <button class="search-trigger" type="button" data-action="open-search" aria-label="Search anything"><span class="search-icon" data-icon="search"></span><span class="search-placeholder">Search anything...</span><kbd>⌘ K</kbd></button>
        </div>
        <div class="topbar-actions">
          <div class="notification-wrap">
            <button class="top-icon-button notification-button" type="button" data-action="toggle-notifications" aria-label="Notifications"><span data-icon="bell"></span><i class="notification-dot"></i></button>
            <div class="notification-popover" id="notification-popover" hidden></div>
          </div>
          <button class="user-menu" type="button" data-action="profile-menu" aria-label="Open Sarah Johnson profile">
            <span class="user-avatar">SJ</span><span class="user-copy"><strong>Sarah Johnson</strong><small>HR Administrator</small></span><span class="user-chevron">⌄</span>
          </button>
        </div>
      </header>
      <div class="page-content" id="page-content" tabindex="-1"></div>
    </main>
  </div>
  <div id="modal-root"></div>
  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>
  <div class="search-overlay" id="search-overlay" aria-hidden="true">
    <div class="search-backdrop" data-action="close-search"></div>
    <section class="search-dialog" role="dialog" aria-modal="true" aria-label="Search HRMS">
      <div class="global-search-box"><span data-icon="search"></span><input id="global-search-input" type="search" placeholder="Search employees, modules, or roles..." autocomplete="off" /><kbd>ESC</kbd></div>
      <div class="search-results" id="search-results"></div>
      <div class="search-foot"><span>↑ ↓ to navigate</span><span><kbd>↵</kbd> to open</span><span>Search this workspace</span></div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
