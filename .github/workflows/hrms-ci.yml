name: HRMS CI

on:
  push:
    paths:
      - "hrms/**"
      - ".github/workflows/hrms-ci.yml"
  pull_request:
    paths:
      - "hrms/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hrms
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: hrms
          POSTGRES_DB: hrms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrms -d hrms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://hrms:hrms@localhost:5432/hrms
      AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hrms/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Migrate and seed database
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build
